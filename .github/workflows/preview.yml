name: preview

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write # GitHub OIDC -> JFrog
  pull-requests: write # label + comment
  issues: write

env:
  REGISTRY: ${{ secrets.REGISTRY }}
  IMAGE: infra-oci-web-apps-sandbox-green/wallet-connect-live-app/dev
  PREVIEW_HOST: wallet-connect-live-app-pr-${{ github.event.pull_request.number }}.aws.sbx.ldg-tech.com

jobs:
  build:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: public-ledgerhq-shared-medium
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: JFrog OIDC login
        id: jfrog
        uses: jfrog/setup-jfrog-cli@5a4fbe1e30dbb570cc62d2513421c4b9bc3c9959 # v4
        env:
          JF_URL: https://${{ env.REGISTRY }}
        with:
          oidc-provider-name: github-oidc
          oidc-audience: jfrog-github
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ steps.jfrog.outputs.oidc-user }}
          password: ${{ steps.jfrog.outputs.oidc-token }}

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          build-args: |
            VITE_WALLETCONNECT_PROJECT_ID=${{ secrets.VITE_WALLETCONNECT_PROJECT_ID }}
            VITE_APP_VERSION=${{ vars.VITE_APP_VERSION }}
            VITE_PUBLIC_SEGMENT_API_KEY_MOBILE=${{ secrets.VITE_PUBLIC_SEGMENT_API_KEY_MOBILE }}
            VITE_PUBLIC_SEGMENT_API_KEY_DESKTOP=${{ secrets.VITE_PUBLIC_SEGMENT_API_KEY_DESKTOP }}
            VITE_APPLICATION_DISABLED=${{ vars.VITE_APPLICATION_DISABLED }}
            VITE_PUBLIC_SENTRY_DSN=${{ secrets.VITE_PUBLIC_SENTRY_DSN }}
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE }}:pr-${{ github.event.pull_request.number }}

      - name: Add preview label
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              labels: ['preview'],
            });

      - name: Comment preview URL
        uses: marocchino/sticky-pull-request-comment@773744901bac0e8cbb5a0dc842800d45e9b2b405 # v2.9.4
        with:
          header: preview-env
          message: |
            🚀 **Preview environment**

            **URL:** https://${{ env.PREVIEW_HOST }}
            **Image:** `${{ env.REGISTRY }}/${{ env.IMAGE }}:pr-${{ github.event.pull_request.number }}`
            **Commit:** `${{ github.event.pull_request.head.sha }}`

            ArgoCD syncs the env within ~30–60s after this image is pushed.
